name: Deployment Validation & CI

on:
  push:
    branches: [main, master, hemanth-dev]
  pull_request:
    branches: [main, master, hemanth-dev]

jobs:
  validate-compose:
    name: Validate Docker Compose Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Dev Docker Compose
        run: docker compose config -q

      - name: Validate Production Docker Compose
        run: |
          cp deploy/.env.production.example deploy/.env.production
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production config -q

  validate-configs:
    name: Validate Datasets & Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install pyyaml

      - name: Validate YAML files
        run: |
          python -c "import yaml; yaml.safe_load(open('configs/india_locations.yaml', encoding='utf-8')); yaml.safe_load(open('data/places_catalog.yaml', encoding='utf-8')); print('YAML configs valid!')"
          python scripts/import_places.py --stats

  build-frontend:
    name: Test Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_API_KEY: demo-key
        run: |
          npm ci
          npm run build
