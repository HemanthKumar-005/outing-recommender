name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backup-restore-drill:
    name: DB backup restore drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres only
        run: |
          docker compose up -d postgres
          echo "Waiting for Postgres to accept TCP connections..."
          for i in {1..30}; do
            if docker compose exec -T postgres sh -c 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" && PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" >/dev/null' 2>/dev/null; then
              echo "Postgres is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres failed to become ready in time" >&2
          exit 1

      - name: Run backup
        run: bash deploy/backup-db.sh /tmp/ci-backups

      - name: Run restore verification
        run: |
          LATEST_BACKUP=$(ls -t /tmp/ci-backups/outing_*.sql.gz | head -1)
          echo "Verifying backup: $LATEST_BACKUP"
          bash deploy/restore-verify.sh "$LATEST_BACKUP"

      - name: Tear down
        if: always()
        run: docker compose down -v
