x-python-env: &python-env
  PYTHONUNBUFFERED: "1"
  APP_ENV: production
  SENTRY_DSN: ${SENTRY_DSN:-}

x-auth-env: &auth-env
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 random chars)}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}

networks:
  outing_prod_net:
    driver: bridge
    name: outing_prod_network

services:
  # =========================================================================
  # REVERSE PROXY (PUBLIC ENTRYPOINT)
  # =========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: outing-nginx
    restart: always
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?set DOMAIN_NAME (the hostname you serve, e.g. nearby.example.com)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - outing_prod_net

  # Free TLS certificates (Let's Encrypt). Bootstrap once with scripts/init-letsencrypt.sh;
  # this container then renews them every 12 hours.
  certbot:
    image: certbot/certbot:latest
    container_name: outing-certbot
    restart: unless-stopped
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - outing_prod_net

  # =========================================================================
  # CORE INFRASTRUCTURE (INTERNAL ONLY - NO HOST PORTS EXPOSED)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: outing-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-outing}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_ROLE_PW: ${APP_ROLE_PW:?}
      GATEWAY_ROLE_PW: ${GATEWAY_ROLE_PW:?}
      WORKER_ROLE_PW: ${WORKER_ROLE_PW:?}
      TRAINER_ROLE_PW: ${TRAINER_ROLE_PW:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-outing}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - outing_prod_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: outing-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?set RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - outing_prod_net

  redis:
    image: redis:7-alpine
    container_name: outing-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - outing_prod_net

  # =========================================================================
  # API GATEWAY & FRONTEND
  # =========================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_TILE_URL: ${NEXT_PUBLIC_TILE_URL:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
    container_name: outing-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      - api-gateway
    networks:
      - outing_prod_net

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: outing-api-gateway
    restart: unless-stopped
    environment:
      <<: [*python-env, *auth-env]
      TRUST_PROXY: "true"            # we sit behind nginx, which sets X-Forwarded-For
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL, e.g. https://nearby.example.com}
      CORS_ORIGINS: ${PUBLIC_BASE_URL}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?set TURNSTILE_SECRET_KEY (Cloudflare Turnstile, free)}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      MAX_TENANTS: ${MAX_TENANTS:-100}
      PLATFORM_DATABASE_URL: postgresql://gateway_role:${GATEWAY_ROLE_PW:?}@postgres:5432/${POSTGRES_DB:-outing}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      USER_SERVICE_URL: http://user-service:8000
      PLACE_SERVICE_URL: http://place-service:8000
      CONTEXT_SERVICE_URL: http://context-service:8000
      INTERACTION_SERVICE_URL: http://interaction-service:8000
      RECOMMENDATION_ENGINE_URL: http://recommendation-engine:8000
      ITINERARY_SERVICE_URL: http://itinerary-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      place-service:
        condition: service_started
      context-service:
        condition: service_started
      interaction-service:
        condition: service_started
      recommendation-engine:
        condition: service_started
      itinerary-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - outing_prod_net

  # =========================================================================
  # APPLICATION MICROSERVICES
  # =========================================================================
  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    container_name: outing-user-service
    restart: unless-stopped
    environment:
      <<: [*python-env, *auth-env]
      TERMS_VERSION: ${TERMS_VERSION:-2026-10-21}
      DATABASE_URL: postgresql://app_role:${APP_ROLE_PW:?set APP_ROLE_PW in .env}@postgres:5432/${POSTGRES_DB:-outing}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASS:?set RABBITMQ_PASS}@rabbitmq:5672/%2F
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - outing_prod_net

  place-service:
    build:
      context: ..
      dockerfile: services/place-service/Dockerfile
    container_name: outing-place-service
    restart: unless-stopped
    environment:
      <<: *python-env
      VERIFIED_ONLY: ${VERIFIED_ONLY:-true}   # launch gate: show only human-verified venues
      DATABASE_URL: postgresql://app_role:${APP_ROLE_PW:?set APP_ROLE_PW in .env}@postgres:5432/${POSTGRES_DB:-outing}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASS:?set RABBITMQ_PASS}@rabbitmq:5672/%2F
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - outing_prod_net

  context-service:
    build:
      context: ..
      dockerfile: services/context-service/Dockerfile
    container_name: outing-context-service
    restart: unless-stopped
    environment:
      <<: *python-env
      ALLOW_MOCK_WEATHER: "false"
      OPEN_METEO_ENABLED: ${OPEN_METEO_ENABLED:-true}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - outing_prod_net

  interaction-service:
    build:
      context: ..
      dockerfile: services/interaction-service/Dockerfile
    container_name: outing-interaction-service
    restart: unless-stopped
    environment:
      <<: *python-env
      DATABASE_URL: postgresql://app_role:${APP_ROLE_PW:?set APP_ROLE_PW in .env}@postgres:5432/${POSTGRES_DB:-outing}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASS:?set RABBITMQ_PASS}@rabbitmq:5672/%2F
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - outing_prod_net

  recommendation-engine:
    build:
      context: ..
      dockerfile: services/recommendation-engine/Dockerfile
    container_name: outing-recommendation-engine
    restart: unless-stopped
    environment:
      <<: *python-env
      MODEL_PATH: /models/xgboost_model.json
      MODEL_METADATA_PATH: /models/xgboost_model.meta.json
      RANKING_CONFIG_PATH: /configs/ranking.yaml
      EVALUATION_RESULTS_PATH: /evaluation/evaluation_results.csv
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASS:?set RABBITMQ_PASS}@rabbitmq:5672/%2F
      USER_SERVICE_URL: http://user-service:8000
      PLACE_SERVICE_URL: http://place-service:8000
      CONTEXT_SERVICE_URL: http://context-service:8000
      INTERACTION_SERVICE_URL: http://interaction-service:8000
    volumes:
      - models_data:/models
      - ../configs:/configs:ro
      - ../evaluation:/evaluation:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      place-service:
        condition: service_started
      context-service:
        condition: service_started
      interaction-service:
        condition: service_started
    networks:
      - outing_prod_net

  itinerary-service:
    build:
      context: ..
      dockerfile: services/itinerary-service/Dockerfile
    container_name: outing-itinerary-service
    restart: unless-stopped
    environment:
      <<: *python-env
      DATABASE_URL: postgresql://app_role:${APP_ROLE_PW:?set APP_ROLE_PW in .env}@postgres:5432/${POSTGRES_DB:-outing}
      PLATFORM_DATABASE_URL: postgresql://worker_role:${WORKER_ROLE_PW:?}@postgres:5432/${POSTGRES_DB:-outing}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASS:?set RABBITMQ_PASS}@rabbitmq:5672/%2F
      PLACE_SERVICE_URL: http://place-service:8000
      CONTEXT_SERVICE_URL: http://context-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      place-service:
        condition: service_started
      context-service:
        condition: service_started
    networks:
      - outing_prod_net

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: outing-notification-service
    restart: unless-stopped
    environment:
      <<: *python-env
      DATABASE_URL: postgresql://app_role:${APP_ROLE_PW:?set APP_ROLE_PW in .env}@postgres:5432/${POSTGRES_DB:-outing}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASS:?set RABBITMQ_PASS}@rabbitmq:5672/%2F
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - outing_prod_net

  # =========================================================================
  # BACKGROUND WORKERS
  # =========================================================================
  model-training-worker:
    build:
      context: ..
      dockerfile: services/model-training-worker/Dockerfile
    container_name: outing-model-worker
    restart: on-failure
    environment:
      <<: *python-env
      MODEL_PATH: /models/xgboost_model.json
      MODEL_METADATA_PATH: /models/xgboost_model.meta.json
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASS:?set RABBITMQ_PASS}@rabbitmq:5672/%2F
      DAEMON_MODE: "true"
    volumes:
      - models_data:/models
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - outing_prod_net

  sentiment-worker:
    build:
      context: ..
      dockerfile: services/sentiment-worker/Dockerfile
    container_name: outing-sentiment-worker
    restart: unless-stopped
    environment:
      <<: *python-env
      PLACE_SERVICE_URL: http://place-service:8000
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASS:?set RABBITMQ_PASS}@rabbitmq:5672/%2F
      PLATFORM_DATABASE_URL: postgresql://worker_role:${WORKER_ROLE_PW:?}@postgres:5432/${POSTGRES_DB:-outing}
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      place-service:
        condition: service_started
    networks:
      - outing_prod_net

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  models_data:
  hf_cache:
  certbot_www:
  certbot_certs:
