# Install once:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--select, "E9,F63,F7,F82,F811,F401,F841"]
  - repo: local
    hooks:
      - id: block-env-files
        name: block committing .env files
        entry: bash -c 'echo "Refusing to commit a real .env file"; exit 1'
        language: system
        files: '(^|/)\.env(\.production)?$'
