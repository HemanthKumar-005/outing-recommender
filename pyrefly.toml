project-includes = [
    "services",
    "shared",
    "scripts",
    "evaluation",
    "scratch",
]
search-path = [
    "shared",
    "services/api-gateway",
    "services/api-gateway/app",
    "services/context-service",
    "services/context-service/app",
    "services/interaction-service",
    "services/interaction-service/app",
    "services/itinerary-service",
    "services/itinerary-service/app",
    "services/model-training-worker",
    "services/notification-service",
    "services/notification-service/app",
    "services/place-service",
    "services/place-service/app",
    "services/recommendation-engine",
    "services/recommendation-engine/app",
    "services/sentiment-worker",
    "services/user-service",
    "services/user-service/app",
]
infer-with-first-use = false
permissive-ignores = true

[errors]
missing-import = "ignore"
missing-module-attribute = "ignore"
bad-return = "ignore"
unsupported-operation = "ignore"
bad-index = "ignore"
bad-assignment = "ignore"
bad-argument-type = "ignore"
no-matching-overload = "ignore"
missing-attribute = "ignore"
