version: "3.9"

services:
  # =========================================================================
  # REVERSE PROXY & SSL TERMINATION (PUBLIC ENTRYPOINT)
  # =========================================================================
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - api-gateway
      - frontend

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # =========================================================================
  # INTERNAL NETWORK ISOLATION (BOUND TO 127.0.0.1 ONLY)
  # Prevents public access to unauthenticated microservices and datastores.
  # =========================================================================
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  user-service:
    ports:
      - "127.0.0.1:8001:8000"

  place-service:
    ports:
      - "127.0.0.1:8002:8000"

  context-service:
    ports:
      - "127.0.0.1:8003:8000"

  interaction-service:
    ports:
      - "127.0.0.1:8004:8000"

  recommendation-engine:
    ports:
      - "127.0.0.1:8005:8000"

  itinerary-service:
    ports:
      - "127.0.0.1:8006:8000"

  notification-service:
    ports:
      - "127.0.0.1:8007:8000"

  api-gateway:
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  certbot_www:
  certbot_certs:
